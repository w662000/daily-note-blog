<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <style>
    :root { --fg:#222; --muted:#666; --bg:#fafafa; --card:#fff; --accent:#2b6cb0; --border:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); line-height:1.75; }
    header.site { background:var(--card); border-bottom:1px solid var(--border); padding:18px 24px; }
    header.site .wrap { max-width:780px; margin:0 auto; }
    header.site a { color:var(--fg); text-decoration:none; font-weight:700; font-size:20px; }
    main { max-width:780px; margin:24px auto; padding:0 24px; }
    h2.section { font-size:18px; color:var(--muted); margin:8px 0 14px; }
    .post-list { list-style:none; padding:0; margin:0; }
    .post-list li { padding:13px 0; border-bottom:1px solid var(--border); }
    .post-date { color:var(--muted); font-size:13px; margin-right:12px; }
    .post-list a { color:var(--accent); text-decoration:none; font-weight:600; }
    .post-list a:hover { text-decoration:underline; }
    article { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:26px 30px; }
    article h1 { margin-top:0; font-size:24px; }
    article h2 { font-size:19px; margin-top:30px; border-left:4px solid var(--accent); padding-left:10px; }
    article h3 { font-size:16px; }
    article table { border-collapse:collapse; width:100%; margin:16px 0; font-size:14px; }
    article th, article td { border:1px solid var(--border); padding:8px 10px; text-align:left; }
    article th { background:#f3f4f6; }
    article code { background:#f3f4f6; padding:2px 6px; border-radius:4px; font-size:13px; }
    article pre { background:#1e293b; color:#e2e8f0; padding:14px; border-radius:8px; overflow:auto; }
    article pre code { background:none; color:inherit; padding:0; }
    article blockquote { border-left:4px solid var(--border); margin:16px 0; padding:4px 14px; color:var(--muted); }
    footer.site { max-width:780px; margin:40px auto; padding:0 24px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <header class="site"><div class="wrap"><a href="{{ site.baseurl }}/">{{ site.title }}</a></div></header>
  <main>
    {% if page.is_home %}
      {{ content }}
    {% else %}
      <article>
        {{ content }}
      </article>
    {% endif %}
  </main>
  <footer class="site">由 WorkBuddy 自动构建 · 托管于 GitHub Pages</footer>
</body>
</html>
