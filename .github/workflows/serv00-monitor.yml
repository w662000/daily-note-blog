name: Serv00 注册开放监控

# 复用 daily-note-blog 仓库已有的 GitHub 远端（与 handoff 博客源/语雀同一套）。
# 每 10 分钟探测一次 Serv00 免费注册是否开放；开放则自动注册并把账户信息发邮件通知。
on:
  schedule:
    - cron: '*/10 * * * *'        # 每 10 分钟（GitHub Actions 支持的最小粒度）
  workflow_dispatch: {}           # 允许在 Actions 页面手动点 Run workflow 测试

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: serv00-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 诊断环境（Python / 文件）
        run: |
          echo "python: $(python --version 2>&1)"
          echo "python3: $(python3 --version 2>&1)"
          echo "pwd: $(pwd)"
          ls -la

      - name: 探测 Serv00 注册开放 → 自动注册并发邮件通知
        env:
          # 注册 Serv00 用的邮箱（同时作为收通知 + IMAP/SMTP 登录账号）
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_AUTH: ${{ secrets.MAIL_AUTH }}          # 该邮箱的 IMAP/SMTP 授权码
          SERV00_USER: ${{ secrets.SERV00_USER }}       # Serv00 用户名
          SERV00_PASS: ${{ secrets.SERV00_PASS }}       # Serv00 密码
          AUTO_REGISTER: ${{ secrets.AUTO_REGISTER }}   # on / off
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}           # 通知收件人（可留空=MAIL_USER）
        run: python monitor.py
